
<div class="page-container">

  <div class="form-card update-card">

    <!-- Header -->
    <div class="form-header flex-header">

      <div>
        <div class="badge-edit">
          <span class="dot"></span>
          Editing Mode
        </div>

        <h1>Update Employee Details</h1>

        <p>
          Modify and sync existing information for employee
          #{{ EmployeeObj.employeeId || '---' }}.
        </p>
      </div>

      <a routerLink="/list" class="btn-back" aria-label="Back to Employee List">
        &larr; Back to List
      </a>

    </div>

    <form (ngSubmit)="onUpdateEmployee()">

      <!-- Section 1: Personal Details -->
      <div class="form-section">

        <div class="section-title">
          <span class="icon">👤</span>
          <h3>Personal Information</h3>
        </div>

        <div class="form-grid">

          <!-- Employee ID (Locked) -->
          <div class="form-group locked-field">

            <label for="employeeId">
              Employee ID
              <span class="lock-badge">🔒 Locked</span>
            </label>

            <input
              type="number"
              [(ngModel)]="EmployeeObj.employeeId"
              id="employeeId"
              name="employeeId"
              readonly
              class="input-disabled">

          </div>

          <!-- Gender -->
          <div class="form-group">

            <label for="gender">Gender</label>

            <select
              id="gender"
              [(ngModel)]="EmployeeObj.gender"
              name="gender">

              <option value="">Select gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
              <option value="Prefer not to say">Prefer not to say</option>

            </select>

          </div>

          <!-- First Name -->
          <div class="form-group">

            <label for="firstName">First Name *</label>

            <input
              type="text"
              [(ngModel)]="EmployeeObj.firstName"
              id="firstName"
              name="firstName"
              placeholder="Enter first name"
              required>

          </div>

          <!-- Last Name -->
          <div class="form-group">

            <label for="lastName">Last Name *</label>

            <input
              type="text"
              [(ngModel)]="EmployeeObj.lastName"
              id="lastName"
              name="lastName"
              placeholder="Enter last name"
              required>

          </div>

          <!-- Email -->
          <div class="form-group">

            <label for="email">Email Address *</label>

            <input
              type="email"
              [(ngModel)]="EmployeeObj.email"
              id="email"
              name="email"
              placeholder="name@example.com"
              required>

          </div>

          <!-- Phone -->
          <div class="form-group">

            <label for="phoneNumber">Phone Number *</label>

            <input
              type="tel"
              [(ngModel)]="EmployeeObj.phoneNumber"
              id="phoneNumber"
              name="phoneNumber"
              placeholder="10-digit phone number"
              maxlength="10"
              pattern="[0-9]{10}"
              required>

          </div>

          <!-- Date of Birth -->
          <div class="form-group">

            <label for="dateOfBirth">Date of Birth</label>

            <input
              type="date"
              [(ngModel)]="EmployeeObj.dateOfBirth"
              id="dateOfBirth"
              name="dateOfBirth">

          </div>

        </div>
      </div>

      <!-- Section 2: Employment Details -->
      <div class="form-section">

        <div class="section-title">
          <span class="icon">💼</span>
          <h3>Employment & Role Information</h3>
        </div>

        <div class="form-grid">

          <!-- Department -->
          <div class="form-group">

            <label for="department">Department</label>

            <select
              id="department"
              [(ngModel)]="EmployeeObj.department"
              name="department">

              <option value="">Select department</option>
              <option value="IT">IT</option>
              <option value="HR">Human Resources</option>
              <option value="Finance">Finance</option>
              <option value="Marketing">Marketing</option>
              <option value="Sales">Sales</option>
              <option value="Operations">Operations</option>

            </select>

          </div>

          <!-- Designation -->
          <div class="form-group">

            <label for="designation">Designation</label>

            <input
              type="text"
              [(ngModel)]="EmployeeObj.designation"
              id="designation"
              name="designation"
              placeholder="e.g. Software Engineer">

          </div>

          <!-- Date of Joining -->
          <div class="form-group">

            <label for="dateOfJoining">Date of Joining</label>

            <input
              type="date"
              [(ngModel)]="EmployeeObj.dateOfJoining"
              id="dateOfJoining"
              name="dateOfJoining">

          </div>

          <!-- Address -->
          <div class="form-group full-width">

            <label for="address">Address</label>

            <textarea
              id="address"
              [(ngModel)]="EmployeeObj.address"
              name="address"
              rows="3"
              placeholder="Enter complete address"></textarea>

          </div>

        </div>
      </div>

      <!-- Form Actions -->
      <div class="form-actions">

        <button
          type="button"
          class="btn-secondary"
          (click)="onCancel()">
          Cancel
        </button>

        <button
          type="submit"
          class="btn-update">
          Save Changes
        </button>

      </div>

    </form>

  </div>

</div>
